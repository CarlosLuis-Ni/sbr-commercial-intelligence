<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SUINSA Commercial Intelligence — Supplier Business Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,72,400;0,72,500;0,72,600;1,72,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAFAF8;--paper:#FFFFFF;--ink:#14181D;--ink-muted:#6B7178;--ink-faint:#9BA0A6;--line:#E4E5E0;--line-strong:#C9CBC4;--primary:#1C3D5A;--positive:#3F6B52;--negative:#7A4038;--serif:'Newsreader',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{background:var(--bg);scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  button,input,select{font:inherit;}
  .page{max-width:1040px;margin:0 auto;padding:42px 48px 90px;}

  /* Auth / loading */
  .loading{font-family:var(--serif);font-style:italic;color:var(--ink-faint);padding:120px 0;text-align:center;font-size:17px;}
  .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--bg);}
  .auth-card{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);padding:44px 42px;box-shadow:0 16px 50px rgba(20,24,29,.06);}
  .auth-brand{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;margin-bottom:8px;}
  .auth-kicker{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:28px;}
  .auth-card h1{font-family:var(--serif);font-size:32px;font-weight:500;margin-bottom:12px;}
  .auth-description{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink-muted);margin-bottom:30px;}
  .auth-form{display:flex;flex-direction:column;gap:9px;}
  .auth-form label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-top:6px;}
  .auth-form input{font:inherit;font-size:14px;padding:12px 13px;border:1px solid var(--line-strong);background:#fff;outline:none;border-radius:0;}
  .auth-form input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(28,61,90,.08);}
  .auth-form button{margin-top:14px;border:0;background:var(--primary);color:#fff;font:600 13px var(--sans);padding:13px 16px;cursor:pointer;border-radius:0;}
  .auth-form button:disabled{opacity:.65;cursor:wait;}
  .auth-error{min-height:20px;margin-top:8px;color:var(--negative);font-size:12px;line-height:1.5;}

  /* Runtime error */
  .sbr-runtime-error{max-width:720px;margin:120px auto;padding:28px 32px;background:#fff;border:1px solid var(--line-strong);box-shadow:0 12px 40px rgba(20,24,29,.05);}
  .sbr-runtime-error h2{font-family:var(--serif);font-size:28px;font-weight:500;margin-bottom:10px;}
  .sbr-runtime-error p{font-size:14px;line-height:1.6;color:var(--ink-muted);}
  .sbr-runtime-error code{display:block;margin-top:14px;padding:12px;background:#f5f5f2;white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--negative);}

  /* Editorial masthead */
  .masthead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px;flex-wrap:wrap;gap:24px;border-bottom:1px solid var(--line-strong);padding-bottom:24px;}
  .brand{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink);font-weight:600;}
  .module{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin-left:10px;}
  .controls{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;}
  .control{min-width:145px;}
  .control label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;}
  .control select{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:transparent;border:none;border-bottom:1px solid var(--line-strong);padding:4px 22px 7px 0;cursor:pointer;appearance:none;-webkit-appearance:none;border-radius:0;background-image:linear-gradient(45deg,transparent 50%,#9BA0A6 50%),linear-gradient(135deg,#9BA0A6 50%,transparent 50%);background-position:calc(100% - 8px) 9px,calc(100% - 3px) 9px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .control select:focus{outline:none;border-bottom-color:var(--primary);}

  /* Chapter navigation */
  .chapter-tabs{display:flex;gap:0;flex-wrap:wrap;margin:0 0 46px;border-bottom:1px solid var(--line);}
  .chapter-tabs button{appearance:none;border:0;background:transparent;color:var(--ink-muted);padding:9px 13px 11px;font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s ease,border-color .15s ease;white-space:nowrap;}
  .chapter-tabs button:hover{color:var(--ink);}
  .chapter-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}

  /* Typography */
  .kicker,.section-kicker{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}
  .kicker{margin-bottom:12px;}
  .thesis{font-family:var(--serif);font-size:42px;line-height:1.06;font-weight:500;letter-spacing:-.02em;max-width:850px;margin-bottom:10px;}
  .dek{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--ink-muted);margin-bottom:30px;}

  /* KPI strip */
  .kpi-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);margin:30px 0 46px;}
  .kpi-strip>div{padding:18px 18px 19px 0;margin-right:18px;border-right:1px solid var(--line);min-width:0;}
  .kpi-strip>div:last-child{border-right:0;margin-right:0;}
  .kpi-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:8px;}
  .kpi-value{font-size:28px;line-height:1.05;font-weight:600;letter-spacing:-.025em;white-space:nowrap;}
  .kpi-delta{font-size:11.5px;color:var(--ink-muted);margin-top:8px;line-height:1.35;}
  .kpi-delta.up{color:var(--positive);font-weight:600;}
  .kpi-delta.down{color:var(--negative);font-weight:600;}

  /* Panels / sections */
  .panel-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:42px;margin:0 0 42px;}
  .panel-grid>div,.section{min-width:0;}
  .panel-title{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px;}
  .section{border-top:1px solid var(--line-strong);padding-top:25px;margin-top:42px;}
  .section-kicker{margin-bottom:8px;}
  .section-title{font-family:var(--serif);font-size:27px;line-height:1.15;font-weight:500;margin-bottom:24px;}
  .panel-note{font-size:11px;line-height:1.5;color:var(--ink-faint);margin-top:8px;}

  /* Waterfall SVG */
  .wf-value{font-family:var(--sans);font-size:10px;fill:var(--ink);font-weight:600;}
  .wf-label{font-family:var(--sans);font-size:10px;fill:var(--ink-muted);}

  /* Portfolio mix */
  .mix-row{margin:0 0 17px;}
  .mix-top{display:flex;justify-content:space-between;gap:16px;font-size:12px;line-height:1.3;color:var(--ink);margin-bottom:7px;}
  .mix-top span:last-child{color:var(--ink-muted);white-space:nowrap;}
  .mix-track{height:6px;background:#EEF0ED;overflow:hidden;}
  .mix-fill{height:100%;background:var(--primary);min-width:2px;}

  /* ABC */
  .stack-bar{display:flex;width:100%;height:34px;overflow:hidden;margin:8px 0 13px;background:#EEF0ED;}
  .stack-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;min-width:0;}
  .stack-legend{display:flex;gap:20px;flex-wrap:wrap;color:var(--ink-muted);font-size:11px;line-height:1.5;}
  .legend-dot{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:0;border-radius:50%;}

  /* Contribution lists */
  .contrib-list{border-top:1px solid var(--line);}
  .contrib-row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid var(--line);}
  .contrib-name{font-size:13px;font-weight:600;}
  .contrib-tag{display:inline-block;margin-left:8px;font-size:10px;color:var(--ink-faint);}
  .contrib-value{font-size:13px;font-weight:600;white-space:nowrap;}
  .contrib-value.pos{color:var(--positive);}
  .contrib-value.neg{color:var(--negative);}

  /* Executive findings */
  .entry{padding:15px 0;border-bottom:1px solid var(--line);}
  .entry:first-child{border-top:1px solid var(--line);}
  .entry-title{font-size:13.5px;line-height:1.45;font-weight:600;}
  .entry-body{font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--ink-muted);margin-top:4px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:42px;}
  .col-kicker{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;margin-bottom:4px;}
  .col-kicker.opp{color:var(--positive);}
  .col-kicker.risk{color:var(--negative);}

  /* Executive recommendations */
  .exec-table-wrap{overflow-x:auto;margin-top:14px;border-top:1px solid var(--line-strong);}
  .exec-table{width:100%;border-collapse:collapse;font-size:12px;min-width:650px;}
  .exec-table th{padding:11px 12px 10px 0;text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;border-bottom:1px solid var(--line);}
  .exec-table td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45;}
  .exec-table td:last-child,.exec-table th:last-child{padding-right:0;}
  .priority-high{color:var(--negative);font-weight:700;}
  .priority-media{color:var(--primary);font-weight:600;}

  /* Portfolio matrix */
  .matrix-label{font-family:var(--sans);font-size:10px;fill:var(--ink-faint);}
  .matrix-point{font-family:var(--sans);font-size:9.5px;fill:var(--ink);font-weight:600;}

  /* Details / footer */
  details summary{list-style:none;}
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:"▶";display:inline-block;margin-right:7px;color:var(--primary);font-size:12px;line-height:1;transition:transform .15s ease;}
  details[open] summary::before{content:"▼";font-size:10px;}
  .footer-note{margin-top:70px;padding-top:18px;border-top:1px solid var(--line-strong);font-size:10px;line-height:1.5;color:var(--ink-faint);letter-spacing:.02em;}

  /* Mobile */
  @media (max-width:760px){
    .page{padding:30px 20px 70px;}
    .masthead{margin-bottom:22px;padding-bottom:20px;gap:18px;}
    .brand,.module{font-size:10px;}
    .controls{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .control{min-width:0;}
    .control select{font-size:12px;}
    .chapter-tabs{margin-bottom:34px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .chapter-tabs::-webkit-scrollbar{display:none;}
    .chapter-tabs button{font-size:11px;padding:8px 11px 10px;}
    .thesis{font-size:34px;line-height:1.08;}
    .dek{font-size:15px;margin-bottom:24px;}
    .kpi-strip{grid-template-columns:1fr 1fr;margin:24px 0 34px;}
    .kpi-strip>div{padding:14px 12px 15px 0;margin-right:12px;}
    .kpi-strip>div:nth-child(2){border-right:0;margin-right:0;}
    .kpi-strip>div:nth-child(3),.kpi-strip>div:nth-child(4){border-top:1px solid var(--line);padding-top:15px;}
    .kpi-value{font-size:23px;}
    .kpi-delta{font-size:10.5px;}
    .panel-grid,.two-col{grid-template-columns:1fr;gap:30px;}
    .section{margin-top:34px;padding-top:22px;}
    .section-title{font-size:24px;}
    .panel-grid svg{max-width:100%;}
    .stack-legend{gap:10px 16px;}
    .footer-note{margin-top:50px;}
  }
  @media (max-width:430px){
    .controls{grid-template-columns:1fr;}
    .thesis{font-size:30px;}
    .kpi-value{font-size:21px;}
    .chapter-tabs button{padding-left:9px;padding-right:9px;}
  }
  .client-drill-summary{cursor:pointer;font-size:12.5px;color:var(--primary);font-weight:600;list-style:none;display:flex;align-items:center;}
  .client-drill-summary::-webkit-details-marker{display:none;}\n  .client-drill-summary::marker{content:"";}


</style>
</head>
<body>
<div class="page" id="app"><div class="loading">Verificando acceso al SBR…</div></div>
<script>
window.addEventListener('unhandledrejection', function(event){
  const err = event.reason || {};
  const message = err.message || String(err);
  const app = document.getElementById('app');
  if(app && !document.getElementById('login-form')) {
    app.innerHTML = '<div class="sbr-runtime-error"><h2>No fue posible cargar el tablero</h2><p>La autenticación ya fue procesada, pero la aplicación encontró un error al cargar los datos.</p><code>'+String(message).replace(/[&<>]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</code></div>';
  }
  console.error('SBR unhandled rejection', event.reason);
});
window.addEventListener('error', function(event){
  if(!event.error) return;
  const app = document.getElementById('app');
  if(app && !document.getElementById('login-form')) {
    app.innerHTML = '<div class="sbr-runtime-error"><h2>Error al cargar el SBR</h2><p>Se produjo un error inesperado al iniciar la aplicación.</p><code>'+String(event.error.message || event.message).replace(/[&<>]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</code></div>';
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=5"></script>
</body>
</html>
